<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pikotto for YouTubeへようこそ</title>
  <style>
    :root {
      --bg: #f8fbf5;
      --panel-bg: #ffffff;
      --border: #dce9cf;
      --text: #24321d;
      --text-muted: #667260;
      --accent: #7cb342;
      --accent-soft: #eef7e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b2118;
        --panel-bg: #252d21;
        --border: #3d4b35;
        --text: #eef4e9;
        --text-muted: #b3beac;
        --accent: #9ccc65;
        --accent-soft: #303d27;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 24px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      line-height: 1.7;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }
    .lead {
      margin: 0 0 32px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .card {
      margin-bottom: 16px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-bg);
    }
    .card.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .card h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 16px;
    }
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
    }
    .card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .card.primary p { color: var(--text); }
    code {
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--border);
      font-size: 0.9em;
    }
    @media (max-width: 480px) {
      body { padding: 32px 16px 48px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Pikotto for YouTubeへようこそ</h1>
    <p class="lead">YouTubeで見ている瞬間を、ワンクリックでスクリーンショット保存できます。</p>

    <section class="card primary">
      <h2><span class="icon">📌</span>まずはツールバーに固定</h2>
      <p>ブラウザ右上の拡張機能アイコン（パズルのピース）を開き、Pikotto for YouTubeのピンをクリックしてください。いつでもワンクリックでサイドパネルを開けるようになります。</p>
    </section>

    <section class="card">
      <h2><span class="icon">📷</span>あとはYouTubeを開くだけ</h2>
      <p>YouTubeの動画やShortsを再生し、プレイヤー上の撮影ボタン、またはサイドパネルの「今すぐ撮影」から保存できます。画像はダウンロードフォルダの <code>Pikotto_for_YouTube/</code> に保存されます。</p>
    </section>
  </main>
</body>
</html>
